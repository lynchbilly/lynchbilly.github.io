<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WGU Intro to IT | Study + Exam</title>

<style>
:root{
  --bg:#0b0b0d;
  --panel:#121216;
  --line:#24242c;
  --text:#f2f2f4;
  --muted:#b7b7c0;
  --red:#e10600;
  --good:#3ddc84;
  --bad:#ff2a2a;
  --r:20px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto;
  background:
    radial-gradient(800px 400px at 20% 0%, rgba(225,6,0,.15), transparent 60%),
    linear-gradient(180deg,var(--bg),#07070a 80%);
  color:var(--text);
}
.wrap{max-width:1100px;margin:auto;padding:20px}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:15px;
  background:rgba(20,20,25,.8);
}
h1{margin:0;font-size:18px}
.grid{
  margin-top:15px;
  display:grid;
  grid-template-columns:380px 1fr;
  gap:15px;
}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{
  border:1px solid var(--line);
  border-radius:var(--r);
  background:rgba(20,20,25,.85);
  padding:15px;
}
button,select,input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#111;
  color:white;
  cursor:pointer;
}
button.primary{
  border-color:var(--red);
  background:rgba(225,6,0,.15);
}
button:hover{border-color:var(--red)}
.row{display:flex;gap:10px}
.hidden{display:none}

.flash{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid var(--line);
  border-radius:25px;
  padding:30px;
  cursor:pointer;
}
.q{font-size:20px}
.a{font-size:18px;color:#ffcccc}

#studyNav{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:10px;
}

#examActions{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:10px;
}
.goodBtn{border-color:var(--good)}
.badBtn{border-color:var(--bad)}

.notice{
  font-size:12px;
  color:var(--muted);
  margin-top:15px;
}
</style>
</head>

<body>
<div class="wrap">
<header>
  <h1>WGU Intro to IT — Study + Exam</h1>
  <div>By Billy Lynch</div>
</header>

<div class="grid">

<!-- LEFT PANEL -->
<div class="card">

<label>Name (optional)</label>
<input id="nameInput" placeholder="Enter name...">

<div class="row" style="margin-top:8px">
<button id="saveNameBtn" class="primary">Save Name</button>
<button id="clearNameBtn">Clear</button>
</div>

<label style="margin-top:12px">Category</label>
<select id="categorySelect"></select>

<div class="row" style="margin-top:10px">
<button id="goStudyBtn" class="primary">Start Study</button>
<button id="goExamBtn" class="primary">Start Exam</button>
</div>

<div style="margin-top:12px">
<button id="backToMenuBtn">Back to Menu</button>
<button id="resetBtn" style="margin-top:8px">Reset Session</button>
</div>

<div class="notice">
Session-based scores reset on refresh.
</div>

</div>

<!-- RIGHT PANEL -->
<div class="card">

<div id="flash" class="flash">
<div id="cardText" class="q">Click Start Study or Start Exam.</div>
</div>

<!-- STUDY NAV (Moved under flashcard) -->
<div id="studyNav" class="hidden">
<button id="prevBtn">Prev</button>
<button id="flipBtn" class="primary">Flip</button>
<button id="nextBtn">Next</button>
<button id="shuffleBtn">Shuffle</button>
</div>

<!-- EXAM NAV -->
<div id="examActions" class="hidden">
<button id="revealBtn" class="primary">Reveal</button>
<button id="markCorrectBtn" class="goodBtn">Correct</button>
<button id="markMissedBtn" class="badBtn">Missed</button>
</div>

</div>
</div>
</div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

const $=id=>document.getElementById(id)

const DECK=[
{cat:"Business Continuity",q:"How can uptime be improved?",a:"By increasing the amount of time that resources are available for use"},
{cat:"Business Continuity",q:"What is a priority of business continuity?",a:"High availability of resources"},
{cat:"Business Continuity",q:"Which purpose does business continuity planning have?",a:"Identifying priorities when primary systems are not fully operational"}
]

let state={
mode:"menu",
pool:DECK,
idx:0,
showing:false,
examIndex:0,
correct:0,
missed:0
}

function render(){
if(state.mode==="menu"){
$("studyNav").classList.add("hidden")
$("examActions").classList.add("hidden")
$("cardText").className="q"
$("cardText").textContent="Click Start Study or Start Exam."
return
}
if(state.mode==="study"){
$("studyNav").classList.remove("hidden")
$("examActions").classList.add("hidden")
const c=state.pool[state.idx]
if(!state.showing){
$("cardText").className="q"
$("cardText").textContent=c.q
}else{
$("cardText").className="a"
$("cardText").textContent=c.a
}
}
if(state.mode==="exam"){
$("studyNav").classList.add("hidden")
$("examActions").classList.remove("hidden")
const c=state.pool[state.examIndex]
if(!state.showing){
$("cardText").className="q"
$("cardText").textContent=c.q
}else{
$("cardText").className="a"
$("cardText").textContent=c.a
}
}
}

$("goStudyBtn").onclick=()=>{
state.mode="study"
state.idx=0
state.showing=false
render()
}

$("goExamBtn").onclick=()=>{
state.mode="exam"
state.examIndex=0
state.correct=0
state.missed=0
state.showing=false
render()
}

$("flipBtn").onclick=()=>{
if(state.mode==="study"){
state.showing=!state.showing
render()
}
}

$("prevBtn").onclick=()=>{
if(state.mode==="study"){
state.idx=(state.idx-1+state.pool.length)%state.pool.length
state.showing=false
render()
}
}

$("nextBtn").onclick=()=>{
if(state.mode==="study"){
state.idx=(state.idx+1)%state.pool.length
state.showing=false
render()
}
}

$("shuffleBtn").onclick=()=>{
state.pool.sort(()=>Math.random()-.5)
state.idx=0
render()
}

$("revealBtn").onclick=()=>{
if(state.mode==="exam"){
state.showing=true
render()
}
}

$("markCorrectBtn").onclick=()=>{
if(state.mode==="exam"){
state.correct++
state.examIndex++
state.showing=false
if(state.examIndex>=state.pool.length){
alert("Exam Complete! Score: "+state.correct+"/"+state.pool.length)
state.mode="menu"
}
render()
}
}

$("markMissedBtn").onclick=()=>{
if(state.mode==="exam"){
state.missed++
state.examIndex++
state.showing=false
if(state.examIndex>=state.pool.length){
alert("Exam Complete! Score: "+state.correct+"/"+state.pool.length)
state.mode="menu"
}
render()
}
}

$("flash").onclick=()=>{
if(state.mode==="study"){
state.showing=!state.showing
render()
}
}

render()

})
</script>
</body>
</html>
